name: Bug report
description: Something in the toolkit, CLI, QA, renderer or validator is wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, what you got. Paste the error output.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `python -m blockwright doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal build script or .litematic (if relevant)
      description: A few lines of `from blockwright import *` that reproduce it, or attach the file.
  - type: input
    id: os
    attributes:
      label: OS and Python version
