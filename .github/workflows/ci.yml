name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      # No Minecraft files in CI: renderer tests that need textures and the JDK cross-checks skip themselves.
      - name: Test
        run: python -m pytest -q -rs
      - name: CLI smoke test
        shell: bash
        run: |
          mkdir ws && cd ws
          python -m blockwright doctor
          python -m blockwright new ci_hut --style rustic
          python builds/ci_hut.py --no-render
          python -m blockwright qa out/schematics/ci_hut.litematic
